thology also carries a politically consequential history in the formation of nationalist and racial essentialisms."],["p","There is an opposite danger, too. In trying to defend a tradition from reduction, we can lock it inside a national display case and refuse any relationship at all. Amirani does not become less Georgian when he is placed in a careful international conversation. He becomes more legible -- provided that the conversation begins from his own ground."],["p","The task is therefore neither isolation nor absorption. It is relation with integrity."],["h","What this series will do next"],["p","The article on Amirani proposed a creative horizon: the chained hero as the returning fire, a force of freedom that must learn responsibility. This essay sets the method for pursuing that horizon."],["p","The next essays will not try to prove a universal secret behind every myth. They will build a documented set of focused comparisons: Amirani and Prometheus as a problem of transmission; Māui and the ethics of difference; oral variation as the life of a tradition rather than a flaw in it; the rebel, trickster and culture-hero as different names for different functions."],["p","Some outcomes will be uncertain. That is not a failure of the project. It is what happens when the evidence is allowed to stay complicated."],["p","The aim is not to prove that cultures are one."],["p","The aim is to see how distinct cultures give form to pressures that remain recognisable across human life: how power is acquired, how limits are crossed, how a world renews itself, and how fire can become either care or domination."],["p","Amirani remains on his mountain. Prometheus remains in his own Greek horizon. Māui remains inseparable from Māori worlds of relation and authority."],["p","They do not need to become the same figure to illuminate one another."],["p","That is where responsible comparison begins."],["h","EDITORIAL NOTE"],["p","Established context: The Amirani epic has multiple recorded oral variants. The Amirani-Prometheus comparison is a long-standing scholarly question, while direct historical dependence remains debated. Comparative-method scholarship stresses that similarities must be considered alongside differences and context."],["p","Interpretation: \"One flame, many windows,\" the necessary rebel and the fire-bringer as a recurring archetypal force are Illuminismo's interpretive lenses. They are not historical proof of one original myth or one shared theology."],["p","Series commitment: Every future comparison in this cycle will state its object of comparison, its evidentiary limits and the difference that the comparison must preserve."],["h","Notes and sources"],["p","Dodona Kiziria, \"Amirani, a Georgian Folk Hero\" (Indiana University, 1974)."],["p","Jonathan Z. Smith, *Relating Religion: Essays in the Study of Religion* (University of Chicago Press)."],["p","Mary Khukhunaishvili-Tsiklauri, \"Mythological Image of Dali in the Epos of Amirani,\" *Literary Researches* (2022)."],["p","K. Okujava, \"Adyghe Variants of the Amirani Epic,\" *Spekali*."],["p","Te Ara — The Encyclopedia of New Zealand, \"Māui obtains fire.\""],["p","David M. Freidenreich, \"Comparisons Compared: A Methodological Survey of Comparisons of Religion.\""],["p","Bruce Lincoln, *Theorizing Myth: Narrative, Ideology, and Scholarship* (University of Chicago Press, 1999)."],["p","University of Chicago, \"Comparative Mythology: Poetics and Politics.\""]]}],"story":{"title":{"en":"The mountain has not opened.","ka":"მთა ჯერ არ გახსნილა."},"intro":{"en":"An editorial note from the author on bringing two Amiranis into one book.","ka":"ავტორის სარედაქციო წერილი იმაზე, როგორ შეიკრა ორი ამირანი ერთ წიგნად."},"body":{"en":["Of all the stories in ILLUMINISMO, this one is closest to home. The Greek, Indian and Norse decks taught me how other peoples tell of fire and its price. Amirani is how my own people tell it: a hero chained in the Caucasus, a faithful dog licking the iron, and smiths who forge it strong again every night.","For a long time he lived with me in two separate forms. In August 2026 I wrote two essays about him, one in English and one in Georgian, about fire, freedom and responsibility. Two pages grew out of them that did not know about each other. One was an English path through ten questions, built on comparison and sources. The other was a Georgian trilogy: twenty-four illustrated scenes, three short films and three choices that shape the ending.","This edition brings them together. The story comes first, as it should, in both languages: from Dali on the cliff to K’ursha at the chain. After it come the reading of the myth, the comparison with Prometheus and other bearers of fire, my essays and the sources. Nothing was thrown away. It was put in order.","Amirani is not one book with one correct plot. He lives in variants, Svan and Kakhetian, older and Christian, and each teller added something. That is why every scene here says plainly what comes from the tradition and what is mine. Where I gave Kamar a voice of her own, or wrote an old man who asks whether the road can still be travelled, the text says so. I would rather show the seams than pretend my version is the old one.","What has kept me with this myth is a simple question. Fire is a gift and a responsibility at the same time. We live in years when new powers arrive faster than the wisdom to use them, and Amirani asks what he must have asked by the hearth long ago: what will you do with a strength that no one can stop?","The legend has no ending, and neither does this page. The mountain has not opened. But K’ursha is still at work, and perhaps that is reason enough to keep going."],"ka":["ყველა ამბიდან, რაც ILLUMINISMO-შია, ეს ყველაზე ახლოს არის სახლთან. ბერძნულმა, ინდურმა და სკანდინავიურმა დასტებმა მასწავლა, როგორ ჰყვებიან სხვა ხალხები ცეცხლსა და მის ფასზე. ამირანი კი ის არის, როგორც ამას ჩემი ხალხი ჰყვება: კავკასიონზე მიჯაჭვული გმირი, ერთგული ძაღლი, რომელიც რკინას ლოკავს, და მჭედლები, რომლებიც ყოველ ღამე ჯაჭვს ისევ ამაგრებენ.","დიდხანს ის ჩემთან ორ ცალკე სახედ ცხოვრობდა. 2026 წლის აგვისტოში მასზე ორი ესე დავწერე, ერთი ინგლისურად, მეორე ქართულად — ცეცხლზე, თავისუფლებასა და პასუხისმგებლობაზე. მათგან ორი გვერდი წამოიზარდა, რომლებმაც ერთმანეთის შესახებ არაფერი იცოდნენ. ერთი ინგლისური გზა იყო ათი კითხვის გავლით, შედარებასა და წყაროებზე აგებული. მეორე ქართული ტრილოგია: ოცდაოთხი ილუსტრირებული სცენა, სამი მოკლე ფილმი და სამი არჩევანი, რომლებიც დასასრულს ცვლის.","ეს გამოცემა მათ ერთად კრავს. ჯერ ამბავი მოდის, როგორც საჭიროა, ორივე ენაზე: კლდეზე მდგარი დალიდან ჯაჭვთან მჯდომ ქურშამდე. შემდეგ — მითის წაკითხვა, შედარება პრომეთესა და ცეცხლის სხვა მატარებლებთან, ჩემი ესეები და წყაროები. არაფერი გადაგდებულა. ყველაფერი თავის ადგილზე დადგა.","ამირანი ერთი წიგნი ერთი სწორი სიუჟეტით არ არის. ის ვარიანტებში ცხოვრობს — სვანურში და კახურში, ძველსა და ქრისტიანულში — და ყოველმა მთხრობელმა რაღაც დაუმატა. ამიტომ აქ ყოველი სცენა პირდაპირ ამბობს, რა მოდის ტრადიციიდან და რა არის ჩემი. სადაც ყამარს საკუთარი ხმა მივეცი, ან დავწერე მოხუცი, რომელიც კითხულობს, გზაზე გავლა ისევ შეიძლება თუ არა, ტექსტი ამას ამბობს. მირჩევნია ნაკერები ვაჩვენო, ვიდრე ვითვალთმაქცო, თითქოს ჩემი ვერსია ძველია.","ამ მითთან მარტივმა კითხვამ დამაკავა. ცეცხლი ერთდროულად საჩუქარიცაა და პასუხისმგებლობაც. ისეთ წლებში ვცხოვრობთ, როცა ახალი ძალა იმაზე სწრაფად მოდის, ვიდრე მისი გამოყენების სიბრძნე, და ამირანი იმას გვეკითხება, რასაც ალბათ ოდესღაც კერასთანაც კითხულობდა: რას უზამ ძალას, რომელსაც ვერავინ შეაჩერებს?","თქმულებას დასასრული არ აქვს, არც ამ გვერდს. მთა ჯერ არ გახსნილა. მაგრამ ქურშა ჯერ კიდევ შრომობს — და იქნებ ეს საკმარისი მიზეზია, რომ გავაგრძელოთ."]},"signature":{"en":"Nika Khutsurauli · November 2026","ka":"ნიკა ხუცურაული · 2026 წლის ნოემბერი"},"timeline":[{"label":{"en":"August 2026","ka":"2026 წლის აგვისტო"},"title":{"en":"Two essays","ka":"ორი ესე"},"body":{"en":"“Amirani and the Returning Fire” in English and “Amirani: fire, freedom and responsibility” in Georgian, with a third essay on comparing myths without erasing them.","ka":"„Amirani and the Returning Fire“ ინგლისურად და „ამირანი: ცეცხლი, თავისუფლება და პასუხისმგებლობა“ ქართულად, მესამე ესესთან ერთად იმაზე, როგორ შევადაროთ მითები ისე, რომ არცერთი არ წაიშალოს."}},{"label":{"en":"September 2026","ka":"2026 წლის სექტემბერი"},"title":{"en":"Two separate editions","ka":"ორი ცალკე გამოცემა"},"body":{"en":"An English reading in ten scenes with comparison and sources, and a Georgian trilogy of 24 illustrations, three films and three choices.","ka":"ინგლისური წაკითხვა ათ სცენაში, შედარებითა და წყაროებით, და ქართული ტრილოგია 24 ილუსტრაციით, სამი ფილმითა და სამი არჩევანით."}},{"label":{"en":"November 2026","ka":"2026 წლის ნოემბერი"},"title":{"en":"One book, two languages","ka":"ერთი წიგნი, ორი ენა"},"body":{"en":"Both editions joined into one bilingual page in the ILLUMINISMO style, beside the Greek, Indian and Norse tarot decks.","ka":"ორივე გამოცემა ერთ ორენოვან გვერდად შეიკრა ILLUMINISMO-ს სტილით, ბერძნული, ინდური და სკანდინავიური ტაროს გვერდით."}}]},"author":{"name":{"en":"Nika Khutsurauli","ka":"ნიკა ხუცურაული"},"role":{"en":"AI Operator · Founder & Editor, ILLUMINISMO","ka":"AI ოპერატორი · ILLUMINISMO-ს დამფუძნებელი და რედაქტორი"},"bio":{"en":"Nika Khutsurauli is the founder and editor of ILLUMINISMO, an independent creative project that explores old stories through new forms. His background brings together history, media analysis and hands-on logistics. He works with AI to turn questions into research, ideas into working prototypes, and stories into music and interactive worlds.","ka":"ნიკა ხუცურაული ILLUMINISMO-ს დამფუძნებელი და რედაქტორია. ეს დამოუკიდებელი შემოქმედებითი პროექტია, რომელიც ძველ ამბებს ახალი ფორმებით იკვლევს. მისი გამოცდილება ისტორიას, მედიაანალიზსა და პრაქტიკულ ლოგისტიკას აერთიანებს. ხელოვნურ ინტელექტთან ერთად ის კითხვებს კვლევად, იდეებს მოქმედ პროტოტიპებად, ამბებს კი მუსიკად და ინტერაქტიულ სამყაროებად აქცევს."},"links":[{"label":{"en":"Portfolio","ka":"პორტფოლიო"},"url":"https://illuminismo.github.io/portfolio/"},{"label":{"en":"LinkedIn","ka":"LinkedIn"},"url":"https://www.linkedin.com/in/nika-khutsurauli-a7329b178/"},{"label":{"en":"YouTube","ka":"YouTube"},"url":"https://www.youtube.com/@illuminismo7"}]},"ui":{"en":{"sub":"AMIRANI · ILLUSTRATED EPIC","navEpic":"The story","navFilms":"Films","navReading":"Reading the myth","navCompare":"Comparison","navEssays":"Essays","navSources":"Sources","navStory":"Editorial","eyebrow":"GEORGIAN MYTH · INTERACTIVE TRILOGY","h1":"Amirani","h1b":"The price of fire","lede":"A man who overcame the cliffs, and a limit that strength could not overcome. The Georgian epic of Amirani in 24 illustrated scenes, three short films, a reading of the myth and the author’s essays, in English and Georgian.","begin":"Begin the story","watch":"Watch the trilogy","meta":"3 parts · 24 illustrations · 3 films · 3 choices","epicEye":"THE STORY · 24 SCENES","epicH":"The trilogy","epicLede":"The scenes join motifs from several variants of the legend with the author’s own scenes. Each one says which is which. At three points you choose a perspective; your answers shape the epilogue and stay only in this browser.","part":"Part","detail":"Tradition and authorship","saved":"Saved","epilogue":"Your epilogue","reset":"Clear my choices","filmsEye":"FILMS","filmsH":"The trilogy in motion","filmsLede":"Three films of 64 seconds each animate the illustrations of each part, with a background tone. There are no actors and no narrator; the lines appear as subtitles in the language you have chosen.","readEye":"READING THE MYTH · 10 QUESTIONS","readH":"The returning fire","readLede":"The English edition read Amirani through ten questions. Each one marks what belongs to the tradition, what is comparison and what is the author’s interpretation, and where the reading has to stop.","kind":{"tradition":"Tradition","interpretation":"Interpretation","comparison":"Comparison","creative":"Creative ending"},"boundary":"Where the reading stops","question":"Question","refs":"Sources","cmpEye":"COMPARISON","cmpH":"A constellation, not a family tree","cmpLede":"Five figures, each in its own world. Similar motifs are not proof of a shared origin; the comparison shows where each analogy has to stop.","shared":"What they share","diff":"What stays different","essEye":"ESSAYS","essH":"The author’s essays","essLede":"The essays the two editions grew from, in the language they were written in.","essLang":{"en":"English","ka":"Georgian"},"srcEye":"SOURCES","srcH":"Where the story comes from","srcLede":"Folklore scholarship, reference works and primary texts. Older and partial sources are named as such.","about":"About this edition","aboutText":"A modern artistic adaptation of a Georgian myth. Motifs from different variants are joined into one path; the dialogues, inner monologues and choice-based epilogues are original. The 24 illustrations and two essay images were created with AI for this project: they are an imagined visual interpretation, not a historical reconstruction. Amirani is not presented as a copy of Prometheus, and no exact date or line of origin is claimed for the myth.","storyEye":"ILLUMINISMO / AMIRANI · EDITORIAL","history":"How the book came together","authorEye":"About the author","foot":"Georgian myth · English & Georgian","open":"Open"},"ka":{"sub":"ამირანი · ილუსტრირებული ეპოსი","navEpic":"ამბავი","navFilms":"ფილმები","navReading":"მითის წაკითხვა","navCompare":"შედარება","navEssays":"ესეები","navSources":"წყაროები","navStory":"სარედაქციო","eyebrow":"ქართული მითოსი · ინტერაქტიული ტრილოგია","h1":"ამირანი","h1b":"ცეცხლის ფასი","lede":"კაცი, რომელმაც კლდეებს სძლია, და ზღვარი, რომელსაც ძალა ვერ მოერია. ამირანის ქართული ეპოსი 24 ილუსტრირებულ სცენაში, სამ მოკლე ფილმში, მითის წაკითხვასა და ავტორის ესეებში — ქართულად და ინგლისურად.","begin":"დაიწყე ამბავი","watch":"უყურე ტრილოგიას","meta":"3 ნაწილი · 24 ილუსტრაცია · 3 ფილმი · 3 არჩევანი","epicEye":"ამბავი · 24 სცენა","epicH":"ტრილოგია","epicLe (function(){

 D.scenes.forEach((s,i)=>{if(i%8===0){const a=Math.floor(i/8);const h=el('div','act-head');h.id='part-'+(a+1);h.append(el('span','',t('part')+' '+roman[a]),el('h3','',D.acts[lang][a]));root.append(h);const l=el('a','',roman[a]+' · '+D.acts[lang][a]);l.href='#part-'+(a+1);acts.append(l)}
  const art=el('article','scene');const fig=el('figure');const img=el('img');img.src=s.img;img.alt=loc(s.title);img.loading=i<2?'eager':'lazy';img.width=1536;img.height=1024;fig.append(img);
  const b=el('div');b.append(el('p','meta',String(i+1).padStart(2,'0')+' / 24 · '+loc(s.label)),el('h4','',loc(s.title)),el('p','line',loc(s.line)),el('p','text',loc(s.text)));
  const d=el('details');d.append(el('summary','',t('detail')),el('p','',loc(s.detail)));b.append(d);
  if(s.choice){const c=el('div','choices');s.choice[lang].forEach((x,k)=>{const bt=el('button',answers[i]===k?'sel':'',(answers[i]===k?'✓ ':'')+x);bt.setAttribute('aria-pressed',String(answers[i]===k));bt.onclick=()=>{answers[i]=k;save();renderScenes();renderEpi()};c.append(bt)});b.append(c)}
  art.append(fig,b);root.append(art)})}
function renderEpi(){$('#epiText').textContent=ending()}
function renderFilms(){const r=$('#filmList');r.replaceChildren();[0,1,2].forEach(a=>{const f=el('div','film');const v=el('video');v.controls=true;v.preload='metadata';v.playsInline=true;v.poster=D.scenes[a*8].img;v.src='films/part-'+(a+1)+'.mp4';
 const sub=el('div','sub');v.ontimeupdate=()=>{const n=Math.min(7,Math.floor(v.currentTime/8));sub.textContent=v.currentTime>0.2?loc(D.scenes[a*8+n].line):''};v.onended=()=>sub.textContent='';
 const p=el('p');const bb=el('b','',t('part')+' '+roman[a]+' · '+D.acts[lang][a]);p.append(bb,document.createTextNode('8 × 8s · 64s'));f.append(v,sub,p);r.append(f)})}

 const sr=el('div','srcs');s.refs.forEach(id=>{const x=srcById(id);if(x)sr.append(link(x.title,x.url))});right.append(bd,q,sr);it.append(left,right);r.append(it)})}
function renderFigs(){const r=$('#figList');r.replaceChildren();D.figures.forEach(f=>{const c=el('article','fig');c.append(el('div','place',loc(f.place)),el('h4','',loc(f.name)),el('div','role',loc(f.role)));

let essayIdx=null;
function linkify(p,text){const re=/\(?(https?:\/\/[^\s)]+)\)?/g;let last=0,m;while((m=re.exec(text))){p.append(document.createTextNode(text.slice(last,m.index)));const a=el('a','',' ↗');a.href=m[1];a.target='_blank';a.rel='noopener noreferrer';p.append(a);last=re.lastIndex}p.append(document.createTextNode(text.slice(last)))}

 const tl=$('#timeline');tl.replaceChildren();s.timeline.forEach(x=>{const e=el('article','timeline-entry');e.append(el('p','timeline-date',loc(x.label)));const d=el('div');d.append(el('h3','',loc(x.title)),el('p','',loc(x.body)));e.append(d);tl.append(e)});
 const a=D.author;$('#aName').textContent=loc(a.name);$('#aRole').textContent=loc(a.role);$('#aBio').textContent=loc(a.bio);const l=$('#aLinks');l.replaceChildren();a.links.forEach(x=>l.append(link(loc(x.label),x.url)))}
function apply(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(n=>{const v=t(n.dataset.t);if(typeof v==='string')n.textContent=v});
